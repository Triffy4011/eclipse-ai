<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Eclipse AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      background: #050816;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .chat-container {
      width: 360px;
      max-width: 90vw;
      background: #0b1020;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .header {
      font-size: 18px;
      font-weight: 600;
    }
    .sub {
      font-size: 12px;
      color: #9ca3af;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      border-radius: 8px;
      background: #050816;
      padding: 8px;
      font-size: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      padding: 8px 10px;
      border-radius: 10px;
      max-width: 90%;
      line-height: 1.4;
    }
    .user {
      align-self: flex-end;
      background: #2563eb;
    }
    .bot {
      align-self: flex-start;
      background: #111827;
    }
    .input-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    input {
      flex: 1;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid #374151;
      background: #020617;
      color: #e5e7eb;
      outline: none;
      font-size: 14px;
    }
    button {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: none;
      background: radial-gradient(circle at 30% 30%, #38bdf8, #6366f1, #a855f7);
      cursor: pointer;
      color: #fff;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    button:disabled {
      opacity: 0.5;
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div>
      <div class="header">Eclipse AI</div>
      <div class="sub">Gemini 1.5 Flash assistant</div>
    </div>

    <div id="messages" class="messages">
      <div class="msg bot">
        Eclipse AI is powered by Gemini 1.5 Flash through a secure server route. No local model, so it works on school Chromebooks.
      </div>
    </div>

    <div class="input-row">
      <input id="input" type="text" placeholder="Ask Eclipse anything..." />
      <button id="sendBtn">➤</button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");

    function addMessage(text, role) {
      const div = document.createElement("div");
      div.className = "msg " + (role === "user" ? "user" : "bot");
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      addMessage(text, "user");
      inputEl.value = "";
      sendBtn.disabled = true;

      try {
        const res = await fetch("https://triffy4011-eclipse-ai.vercel.app/api/gemini", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });

        const data = await res.json();
        addMessage(data.reply || "I couldn’t generate a response, Player.", "bot");
      } catch (err) {
        console.error(err);
        addMessage("I hit a server issue, Player. Try again in a bit.", "bot");
      } finally {
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
